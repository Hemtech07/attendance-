<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14231F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Attendance</title>
<style>
:root{--paper:#F3F5F2;--ink:#14231F;--mute:#5B6B65;--line:#D5DBD6;--in:#1F7A55;--out:#C9831B;--card:#fff;--bad:#B3261E}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:76px}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header b{font-size:18px;letter-spacing:.2px}
a{color:var(--in)}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
main{max-width:560px;margin:0 auto;padding:18px}
h2{font-size:20px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.link{background:none;border:0;color:var(--in);font-weight:600;padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px 4px;color:var(--mute);font-weight:600;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--ink)}
.clock{text-align:center;margin:6px 0 18px}
.clock .t{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.clock .d{color:var(--mute)}
.punch{display:block;margin:0 auto 10px;width:190px;height:190px;border-radius:50%;border:0;color:#fff;font-size:28px;font-weight:700;box-shadow:0 0 0 10px #1F7A5522}
.punch.in{background:var(--in)}
.punch.out{background:var(--out);box-shadow:0 0 0 10px #C9831B28}
.status{text-align:center;color:var(--mute);margin-bottom:18px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600}
td.x button{background:none;border:0;color:var(--bad);font-size:18px}
.tot{font-weight:700}
.msg{background:#E3F1EA;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.empty{color:var(--mute);padding:14px 4px}
@media(prefers-reduced-motion:no-preference){.punch{transition:transform .12s}.punch:active{transform:scale(.96)}}
</style>
</head>
<body>
<header><b id="ttl">Attendance</b><span><button id="ib" hidden>Install</button> <button id="lo" hidden>Log out</button></span></header>
<main id="app"></main>
<nav id="nav" hidden>
<button data-v="punch">Punch</button><button data-v="report">Report</button><button data-v="backup">Backup</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let note='',ip=null;
let users=ls.get('att_users',{}),recs=ls.get('att_recs',[]),me=sessionStorage.getItem('att_me'),view='punch',mode='login',tick=null;
const save=()=>{ls.set('att_users',users);ls.set('att_recs',recs)};
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const salt=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
const fD=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fT=d=>new Date(d).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
const ld=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const mins=r=>r.out?Math.round((new Date(r.out)-new Date(r.in))/6e4):null;
const fH=m=>m==null?'-':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const fL=l=>l?l.lat.toFixed(5)+', '+l.lng.toFixed(5):'No GPS';
const lk=l=>l?`<a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">${fL(l)}</a>`:'No GPS';
function getLoc(){return new Promise(res=>{
  if(!navigator.geolocation)return res({err:'This device has no GPS support.'});
  navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
  e=>res({err:e.code===1?'Location permission is blocked. Allow location for this site in Chrome settings.':e.code===3?'GPS timed out. Go outdoors or turn on Location and try again.':'Location is unavailable. Turn on Location in your phone settings.'}),
  {enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
const mine=()=>recs.filter(r=>r.u===me);
const open=()=>mine().find(r=>!r.out);

function render(){
  clearInterval(tick);
  $('#lo').hidden=$('#nav').hidden=!me;
  if(!me){$('#ttl').textContent='Attendance';return auth()}
  $('#ttl').textContent=users[me].name;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ({punch,report,backup})[view]();
}
function auth(){
  const reg=mode==='register';
  app.innerHTML=`<div class="card"><h2>${reg?'Create account':'Log in'}</h2>
  ${reg?'<label>Your name</label><input id="nm" autocomplete="name">':''}
  <label>Username</label><input id="un" autocapitalize="none" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?'<label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password">':''}
  <div class="err" id="er"></div>
  <button class="btn" id="go" style="width:100%;margin-top:6px">${reg?'Register':'Log in'}</button>
  <button class="link" id="sw">${reg?'Already registered? Log in':'New here? Register'}</button></div>`;
  $('#sw').onclick=()=>{mode=reg?'login':'register';auth()};
  $('#go').onclick=async()=>{
    const un=$('#un').value.trim().toLowerCase(),pw=$('#pw').value,er=$('#er');
    if(!un||!pw){er.textContent='Enter a username and password.';return}
    if(reg){
      const nm=$('#nm').value.trim();
      if(!nm){er.textContent='Enter your name.';return}
      if(users[un]){er.textContent='That username is taken. Choose another.';return}
      if(pw.length<4){er.textContent='Password must be at least 4 characters.';return}
      if(pw!==$('#pw2').value){er.textContent='Passwords do not match.';return}
      const s=salt();users[un]={name:nm,salt:s,hash:await hash(s+pw)};save();
    }else{
      const u=users[un];
      if(!u||u.hash!==await hash(u.salt+pw)){er.textContent='Wrong username or password.';return}
    }
    me=un;sessionStorage.setItem('att_me',me);view='punch';render();
  };
}
function punch(){
  const o=open();
  app.innerHTML=`<div class="clock"><div class="t" id="ck"></div><div class="d" id="dt"></div></div>
  <button class="punch ${o?'out':'in'}" id="pb">${o?'Exit':'Enter'}</button>
  <div class="status">${o?'Entered at '+fT(o.in)+' on '+fD(o.in):'You are not entered'}</div>${note?`<div class="msg" style="margin:-8px 0 16px">${esc(note)}</div>`:''}
  <h2>Today</h2><div class="card wrap" id="td"></div>`;
  const clk=()=>{const n=new Date();$('#ck').textContent=n.toLocaleTimeString('en-US');$('#dt').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
  clk();tick=setInterval(clk,1000);
  $('#pb').onclick=async()=>{
    const b=$('#pb');b.disabled=true;b.textContent='Getting GPS...';
    const g=await getLoc(),loc=g.err?null:{lat:g.lat,lng:g.lng,acc:g.acc},now=new Date().toISOString(),c=open();
    if(c){c.out=now;c.outL=loc}else recs.push({id:Date.now(),u:me,in:now,out:null,inL:loc,outL:null});
    note=g.err?'Saved without location. '+g.err:'Location saved (accurate to about '+g.acc+' m).';
    save();punch();
  };
  const t=mine().filter(r=>ld(r.in)===ld(new Date()));
  $('#td').innerHTML=t.length?`<table><tr><th>Entry</th><th>Exit</th><th>Hours</th><th>Entry GPS</th><th>Exit GPS</th></tr>${t.map(r=>`<tr><td>${fT(r.in)}</td><td>${r.out?fT(r.out):'-'}</td><td>${fH(mins(r))}</td><td>${lk(r.inL)}</td><td>${r.out?lk(r.outL):'-'}</td></tr>`).join('')}</table>`:'<div class="empty">No entries yet today. Tap Enter to start.</div>';
}
function rows(f,t){return mine().filter(r=>ld(r.in)>=f&&ld(r.in)<=t).sort((a,b)=>new Date(a.in)-new Date(b.in))}
function report(){
  const n=new Date(),f0=ld(new Date(n.getFullYear(),n.getMonth(),1));
  app.innerHTML=`<h2>Report</h2><div class="card"><div class="row"><div><label>From</label><input type="date" id="f" value="${f0}"></div><div><label>To</label><input type="date" id="t" value="${ld(n)}"></div></div></div>
  <div class="card wrap" id="rp"></div>
  <div class="row" style="margin-bottom:14px"><button class="btn" id="xp">PDF</button><button class="btn" id="xi">Image</button><button class="btn" id="xe">Excel</button></div><div id="mg"></div>`;
  const get=()=>rows($('#f').value,$('#t').value);
  const draw=()=>{
    const r=get(),tot=r.reduce((s,x)=>s+(mins(x)||0),0);
    $('#rp').innerHTML=`<div style="padding:4px 2px"><b>${esc(users[me].name)}</b><div style="color:var(--mute);font-size:14px;margin-bottom:8px">${fD($('#f').value)} to ${fD($('#t').value)}</div>`+
    (r.length?`<table><tr><th>Date</th><th>Entry</th><th>Exit</th><th>Hours</th><th>Entry GPS</th><th>Exit GPS</th><th></th></tr>${r.map(x=>`<tr><td>${fD(x.in)}</td><td>${fT(x.in)}</td><td>${x.out?fT(x.out):'-'}</td><td>${fH(mins(x))}</td><td>${lk(x.inL)}</td><td>${x.out?lk(x.outL):'-'}</td><td class="x" data-h="1"><button data-id="${x.id}" aria-label="Delete entry">×</button></td></tr>`).join('')}<tr class="tot"><td colspan="3">Total</td><td colspan="4">${fH(tot)}</td></tr></table>`:'<div class="empty">No attendance in this range.</div>')+'</div>';
    $('#rp').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){recs=recs.filter(x=>x.id!=b.dataset.id);save();draw()}});
  };
  draw();$('#f').onchange=$('#t').onchange=draw;
  const nm=()=>`attendance-${me}-${$('#f').value}-to-${$('#t').value}`;
  const data=()=>get().map(x=>[fD(x.in),fT(x.in),x.out?fT(x.out):'-',fH(mins(x)),fL(x.inL),x.out?fL(x.outL):'-']);
  const need=()=>{if(!get().length){$('#mg').innerHTML='<div class="err">No attendance in this range to export.</div>';return false}$('#mg').innerHTML='';return true};
  $('#xp').onclick=()=>{if(!need())return;
    const d=new jspdf.jsPDF();d.setFontSize(15);d.text('Attendance report - '+users[me].name,14,16);d.setFontSize(10);d.text(fD($('#f').value)+' to '+fD($('#t').value),14,23);
    const tot=get().reduce((s,x)=>s+(mins(x)||0),0);
    d.autoTable({startY:28,styles:{fontSize:8},head:[['Date','Entry','Exit','Hours','Entry GPS','Exit GPS']],body:data(),foot:[['Total','','',fH(tot),'','']],headStyles:{fillColor:[20,35,31]},footStyles:{fillColor:[230,235,231],textColor:20}});
    d.save(nm()+'.pdf')};
  $('#xe').onclick=()=>{if(!need())return;
    const ws=XLSX.utils.aoa_to_sheet([['Date','Entry','Exit','Hours','Entry GPS','Exit GPS'],...data()]);ws['!cols']=[{wch:14},{wch:10},{wch:10},{wch:10},{wch:22},{wch:22}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Attendance');XLSX.writeFile(wb,nm()+'.xlsx')};
  $('#xi').onclick=async()=>{if(!need())return;
    const box=$('#rp'),hide=box.querySelectorAll('[data-h]');hide.forEach(e=>e.style.display='none');
    box.style.overflow='visible';box.style.width='max-content';
    const c=await html2canvas(box,{backgroundColor:'#fff',scale:2});hide.forEach(e=>e.style.display='');box.style.overflow='';box.style.width='';
    c.toBlob(b=>dl(b,nm()+'.png'))};
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function backup(){
  const last=ls.get('att_last_backup',null);
  app.innerHTML=`<h2>Backup and restore</h2>
  <div class="card"><b>Back up</b><p style="color:var(--mute);margin:6px 0 12px">Saves all accounts and attendance on this device to one file. Keep the file somewhere safe, such as Google Drive.</p>
  <button class="btn" id="bk" style="width:100%">Download backup</button>
  <div class="msg" ${last?'':'hidden'}>Last backup: ${last?fD(last)+' '+fT(last):''}</div></div>
  <div class="card"><b>Restore</b><p style="color:var(--mute);margin:6px 0 12px">Replaces everything on this device with the backup file. Back up first if you have newer entries.</p>
  <input type="file" id="rf" accept=".json,application/json"><div class="err" id="er"></div></div>`;
  $('#bk').onclick=()=>{const now=new Date().toISOString();
    dl(new Blob([JSON.stringify({app:'attendance',v:1,at:now,users,recs})],{type:'application/json'}),'attendance-backup-'+ld(now)+'.json');
    ls.set('att_last_backup',now);backup()};
  $('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const d=JSON.parse(r.result);
      if(d.app!=='attendance'||typeof d.users!=='object'||!Array.isArray(d.recs))throw 0;
      if(!confirm('Restore '+Object.keys(d.users).length+' account(s) and '+d.recs.length+' entries? This replaces current data.'))return;
      users=d.users;recs=d.recs;save();me=null;sessionStorage.removeItem('att_me');mode='login';render();
    }catch(x){$('#er').textContent='This is not a valid attendance backup file.'}};
    r.readAsText(f)};
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#ib').hidden=false});
$('#ib').onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$('#ib').hidden=true};
addEventListener('appinstalled',()=>{$('#ib').hidden=true});
$('#lo').onclick=()=>{me=null;note='';sessionStorage.removeItem('att_me');mode='login';render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
if(me&&!users[me])me=null;
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
